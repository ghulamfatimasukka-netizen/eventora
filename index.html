<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eventora: find and book event venues in Pakistan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#F4EADB;--card:#FBF5EA;--alm:#E8D5BC;--ink:#3A2A20;--mut:#7B6757;--acc:#4A3426;--gold:#A87B3D;--line:#D9C4A8;--ok:#4F7A4A;--bad:#A5483B;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1611;--card:#2A2019;--alm:#35291F;--ink:#F3E6D4;--mut:#B8A38D;--acc:#E3C9A6;--gold:#D8A964;--line:#4B3B2D;--ok:#8DBB86;--bad:#E0897B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D1611;--card:#2A2019;--alm:#35291F;--ink:#F3E6D4;--mut:#B8A38D;--acc:#E3C9A6;--gold:#D8A964;--line:#4B3B2D;--ok:#8DBB86;--bad:#E0897B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .4em;color:var(--acc)}
h1{font-size:clamp(2.2rem,6vw,3.8rem)}h2{font-size:1.9rem}h3{font-size:1.2rem}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px}
.logo{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.5rem;color:var(--acc);cursor:pointer;white-space:nowrap}
.logo i{color:var(--gold);font-style:normal}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav button{background:none;border:0;padding:8px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;color:var(--mut)}
nav button.on{background:var(--alm);color:var(--acc);font-weight:700}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn.alt{background:var(--alm);color:var(--acc)}.btn.sm{padding:7px 12px;font-size:.9rem}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:1120px;margin:0 auto;padding:24px 18px 60px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding:20px 0 30px}
.hero p{color:var(--mut);max-width:46ch;font-size:1.1rem}
.invite{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 18px 40px -22px rgba(60,35,15,.5);position:relative}
.invite::after{content:"";position:absolute;inset:8px;border:1px dashed var(--gold);border-radius:16px;pointer-events:none;opacity:.6}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;position:relative;z-index:1}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:3px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:18px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.c .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.art{display:grid;place-items:center;font-size:3rem;position:relative}
.art span{filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.heart{position:absolute;top:8px;right:8px;background:var(--card);border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;color:var(--bad)}
.tag{display:inline-block;background:var(--alm);border-radius:20px;padding:2px 10px;font-size:.8rem;color:var(--acc)}
.tag.ok{color:var(--ok)}.tag.no{color:var(--bad)}
.mut{color:var(--mut)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:26px 0}
.steps div{background:var(--alm);border-radius:16px;padding:18px}
.ov{position:fixed;inset:0;background:rgba(30,18,10,.6);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.md{background:var(--bg);border-radius:20px;max-width:680px;width:100%;padding:22px;position:relative;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.x{position:absolute;top:12px;right:14px;background:var(--card);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;cursor:pointer;z-index:2}
.gal{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin:6px 0 14px}.gal .art{border-radius:12px;min-height:90px}
.rv{border-top:1px solid var(--line);padding:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.bar{height:10px;border-radius:6px;background:var(--gold);margin:2px 0 8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--acc);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:60;display:none}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:20px}
@media(max-width:760px){.hero{grid-template-columns:1fr}.gal{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.md{animation:none}}
</style></head><body>
<header><div class="logo" onclick="go('home')">Event<i>ora</i></div><nav id="nav"></nav><span id="acct"></span></header>
<main id="app"></main><div id="toast" role="status"></div>
<footer>Eventora is a project demo. Venues, prices and reviews shown are sample data.</footer>
<script>
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let users=ls.get('ev_users',[]),user=ls.get('ev_user',null),bk=ls.get('ev_bk',[]),favs=ls.get('ev_fav',[]);
let q={city:'',date:'',budget:'',guests:'',type:'',sort:'rating'},view='home',svc='All';
const today=new Date().toISOString().slice(0,10);
const fmt=n=>'PKR '+Math.round(n).toLocaleString('en-PK');
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const T={Banquet:['#D2AE86','#8A5B3B','🏛️'],Marquee:['#DDBF93','#A67447','⛺'],Garden:['#C3C395','#68784A','🌿'],Hall:['#D3BCA0','#7A5A44','🎊'],Farmhouse:['#C9AE80','#7B6738','🏡'],Rooftop:['#D9B8A4','#97604B','🌇']};
const art=(t,i=0,h=150,e)=>`<div class="art" style="height:${h}px;background:linear-gradient(${135+i*50}deg,${T[t][0]},${T[t][1]})"><span>${e||T[t][2]}</span></div>`;
const V=[['Royal Pearl Banquet','Lahore','Banquet',900,4200,4.7,128,'Gulberg'],['Margalla Lawns','Islamabad','Garden',600,5200,4.8,96,'F-7'],['Sapphire Grand Marquee','Karachi','Marquee',1500,3600,4.5,210,'DHA Phase 6'],['Al-Noor Convention Hall','Rawalpindi','Hall',1000,3000,4.3,87,'Saddar'],['Emerald Farmhouse','Lahore','Farmhouse',400,4800,4.6,64,'Bedian Road'],['Skyline Rooftop Lounge','Karachi','Rooftop',250,6500,4.7,73,'Clifton'],['Shalimar Heritage Gardens','Lahore','Garden',1200,4500,4.6,155,'Jail Road'],['Crescent Banquet','Faisalabad','Banquet',800,2800,4.2,59,'Susan Road'],['Indus Palace Hall','Multan','Hall',1100,2600,4.1,48,'Bosan Road'],['Pearl Valley Marquee','Peshawar','Marquee',1300,2400,4.3,71,'Hayatabad'],['Ziarat Lawn Retreat','Quetta','Garden',500,3200,4.4,37,'Jinnah Road'],['Blue Lagoon Banquet','Karachi','Banquet',700,3900,4.4,112,'Gulshan-e-Iqbal'],['Kohsar Grand Ballroom','Islamabad','Hall',800,5800,4.8,102,'Blue Area'],['Heritage Rose Farmhouse','Islamabad','Farmhouse',350,5500,4.5,44,'Bhara Kahu']].map((a,i)=>({id:i+1,n:a[0],c:a[1],t:a[2],cap:a[3],pp:a[4],r:a[5],rc:a[6],loc:a[7]}));
const RV=[['Ayesha K.','Spotless hall, polite staff and the owner met us on time. Great value.'],['Hamza R.','Hosted our walima here. Parking was easy and the sound system was excellent.'],['Sana M.','Lovely lighting for photos. The bridal room was clean and spacious.'],['Bilal A.','Food service was a bit slow, but the venue itself is beautiful.'],['Mariam S.','Transparent pricing with no surprise charges. Would book again.'],['Usman T.','Generator backup saved us during load shedding. Very professional team.']];
const FAC={Banquet:['Air conditioning','Bridal suite','Valet parking','Stage and LED wall'],Marquee:['Large lawn','Open and covered seating','Stage and lighting','Generator backup'],Garden:['Open-air lawn','Fairy lights','Photo spots','Generator backup'],Hall:['Air conditioning','Separate entrances','Prayer area','Ample parking'],Farmhouse:['Pool and lawn','Overnight rooms','Private entry','Bonfire area'],Rooftop:['City view','Lounge seating','Sound system','Lift access']};
const rv=v=>[0,1,2].map(k=>RV[(v.id+k*2)%RV.length]);
const avail=(v,d)=>!d||(hash(v.id+d)%4!==0&&!bk.some(b=>b.vid===v.id&&b.date===d&&b.kind==='Venue booking'&&b.st!=='Cancelled'));
const save=()=>{ls.set('ev_bk',bk);ls.set('ev_fav',favs);ls.set('ev_user',user);ls.set('ev_users',users)};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)}
function modal(h){closeM();const o=document.createElement('div');o.className='ov';o.id='ov';o.onclick=e=>{if(e.target===o)closeM()};o.innerHTML=`<div class="md" role="dialog" aria-modal="true"><button class="x" onclick="closeM()" aria-label="Close">✕</button>${h}</div>`;document.body.appendChild(o)}
function closeM(){const o=$('#ov');if(o)o.remove()}
function need(){if(user)return true;authM('login');return false}
function authM(m){modal(`<h2>${m==='login'?'Welcome back':'Create your account'}</h2><div class="chips"><button class="chip ${m==='login'?'on':''}" onclick="authM('login')">Log in</button><button class="chip ${m==='signup'?'on':''}" onclick="authM('signup')">Sign up</button></div>${m==='signup'?'<label>Full name</label><input id="an" autocomplete="name">':''}<label>Email</label><input id="ae" type="email" autocomplete="email"><label style="margin-top:8px">Password</label><input id="ap" type="password" autocomplete="current-password"><p id="ar" style="color:var(--bad)"></p><button class="btn" onclick="auth('${m}')">${m==='login'?'Log in':'Create account'}</button>`)}
function auth(m){const e=$('#ae').value.trim().toLowerCase(),p=$('#ap').value,n=($('#an')||{}).value;const er=t=>$('#ar').textContent=t;
if(!/^\S+@\S+\.\S+$/.test(e))return er('Enter a valid email address.');if(p.length<6)return er('Password must be at least 6 characters.');
if(m==='signup'){if(!n||!n.trim())return er('Enter your name.');if(users.some(u=>u.e===e))return er('This email already has an account. Log in instead.');const u={n:n.trim(),e,p};users.push(u);user={n:u.n,e}}
else{const u=users.find(x=>x.e===e&&x.p===p);if(!u)return er('Email or password is incorrect.');user={n:u.n,e}}
save();closeM();toast('Signed in as '+user.n);go(view)}
function logout(){user=null;save();toast('Logged out');go('home')}
const NAV=[['home','Home'],['venues','Venues'],['catering','Catering'],['services','Services'],['fireworks','Fireworks'],['bookings','My bookings']];
function go(v){view=v;$('#nav').innerHTML=NAV.map(n=>`<button class="${n[0]===v?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
$('#acct').innerHTML=user?`<button class="btn alt sm" onclick="logout()" title="Log out">${user.n.split(' ')[0]}, log out</button>`:`<button class="btn sm" onclick="authM('login')">Log in</button>`;
$('#app').innerHTML=({home,venues,catering,services,fireworks,bookings})[v]();window.scrollTo(0,0);if(v==='home')plan()}
const filters=()=>`<div class="f"><div><label for="qd">Event date</label><input id="qd" type="date" min="${today}" value="${q.date}"></div><div><label for="qc">City</label><select id="qc"><option value="">All of Pakistan</option>${[...new Set(V.map(v=>v.c))].sort().map(c=>`<option ${q.city===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label for="qg">Expected guests</label><input id="qg" type="number" min="20" step="10" placeholder="e.g. 400" value="${q.guests}"></div><div><label for="qb">Total budget (PKR)</label><input id="qb" type="number" min="0" step="50000" placeholder="e.g. 2000000" value="${q.budget}"></div></div>`;
function readQ(){q.date=$('#qd').value;q.city=$('#qc').value;q.guests=$('#qg').value;q.budget=$('#qb').value}
function home(){return`<section class="hero"><div><h1>Every hall, marquee and garden in one place</h1><p>Tell us your date, guests and budget. Eventora shows only the venues that are free, with photos and reviews, then books a meeting with the owner for you.</p><div class="chips"><span class="tag">Karachi</span><span class="tag">Lahore</span><span class="tag">Islamabad</span><span class="tag">Rawalpindi</span><span class="tag">Faisalabad</span><span class="tag">Multan</span><span class="tag">Peshawar</span><span class="tag">Quetta</span></div></div><div class="invite"><h3>Plan your event</h3>${filters()}<p style="position:relative;z-index:1;margin:14px 0 0"><button class="btn" onclick="readQ();go('venues')">Show available venues</button></p></div></section>
<div class="steps"><div><h3>Search once</h3><p class="mut">Date, guests and budget replace a week of phone calls and visits.</p></div><div><h3>Compare clearly</h3><p class="mut">Prices per head, total cost, photos, facilities and reviews side by side.</p></div><div><h3>Meet the owner</h3><p class="mut">Pick a time slot. Visit first, or pay the advance in the app.</p></div><div><h3>Add everything else</h3><p class="mut">Catering, decor, DJ, photography, fireworks and more under the same plan.</p></div></div>
<h2>Budget planner</h2><p class="mut">Enter your total budget to see a sensible split for a Pakistani wedding or large event.</p><div style="max-width:420px"><label for="pb">Total budget (PKR)</label><input id="pb" type="number" step="50000" value="2500000" oninput="plan()"></div><div id="pl" style="max-width:560px;margin-top:14px"></div>`}
function plan(){const el=$('#pl');if(!el)return;const t=+$('#pb').value||0;el.innerHTML=[['Venue',.4],['Catering',.3],['Decor and lighting',.1],['Photo and video',.07],['DJ and entertainment',.05],['Cards, transport and extras',.08]].map(a=>`<div class="row"><span>${a[0]}</span><b>${fmt(t*a[1])}</b></div><div class="bar" style="width:${a[1]*220}%"></div>`).join('')}
function venues(){return`<h2>Find your venue</h2><div class="invite">${filters()}<div class="f" style="margin-top:12px"><div><label for="qt">Venue type</label><select id="qt"><option value="">Any type</option>${Object.keys(T).map(t=>`<option ${q.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label for="qs">Sort by</label><select id="qs">${[['rating','Top rated'],['low','Price, low to high'],['high','Price, high to low']].map(s=>`<option value="${s[0]}" ${q.sort===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></div><div style="align-self:end"><button class="btn" onclick="readQ();q.type=$('#qt').value;q.sort=$('#qs').value;go('venues')">Search</button></div></div></div><div id="res"></div>`+(setTimeout(res),'')}
function res(){const g=+q.guests||0,b=+q.budget||0;let l=V.filter(v=>(!q.city||v.c===q.city)&&(!q.type||v.t===q.type)&&v.cap>=g&&(!b||v.pp*(g||100)<=b)&&avail(v,q.date));
l.sort((a,b)=>q.sort==='low'?a.pp-b.pp:q.sort==='high'?b.pp-a.pp:b.r-a.r);
$('#res').innerHTML=`<p class="mut">${l.length} venue${l.length===1?'':'s'} ${q.date?'free on '+q.date:'found'}${g?' for '+g+' guests':''}.</p>`+(l.length?`<div class="grid">${l.map(v=>card(v,g)).join('')}</div>`:'<div class="empty"><h3>No venues match</h3>Try another date, a larger budget or a different city.</div>')}
function card(v,g){const n=g||100;return`<div class="c"><div style="position:relative">${art(v.t,v.id%3)}<button class="heart" onclick="fav(${v.id})" aria-label="Save venue">${favs.includes(v.id)?'♥':'♡'}</button></div><div class="b"><div class="row"><h3 style="margin:0">${v.n}</h3></div><span class="mut">${v.t} in ${v.loc}, ${v.c}</span><div class="row"><b>★ ${v.r}</b><span class="mut">${v.rc} reviews</span></div><div class="row"><span>${fmt(v.pp)} per head</span><span class="tag">Up to ${v.cap}</span></div><div class="mut">About ${fmt(v.pp*n)} for ${n} guests</div><span class="tag ok">${q.date?'Available on '+q.date:'Pick a date to check'}</span><button class="btn sm" style="margin-top:8px" onclick="detail(${v.id})">View details</button></div></div>`}
function fav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save();res()}
function detail(id){const v=V.find(x=>x.id===id);modal(`<h2>${v.n}</h2><p class="mut">${v.t} in ${v.loc}, ${v.c}. ★ ${v.r} from ${v.rc} reviews.</p><div class="gal">${art(v.t,0,170)}<div style="display:grid;gap:8px">${art(v.t,1,80,'🪑')}${art(v.t,2,80,'✨')}</div></div><div class="row"><span><b>${fmt(v.pp)}</b> per head</span><span class="tag">Capacity ${v.cap}</span></div><h3 style="margin-top:14px">Facilities</h3><div class="chips">${FAC[v.t].concat(['Parking','Bridal room']).map(f=>`<span class="tag">${f}</span>`).join('')}</div><h3>Reviews</h3>${rv(v).map(r=>`<div class="rv"><b>${r[0]}</b> <span class="mut">★ ${(v.r-.1*(r[0].length%3)).toFixed(1)}</span><br>${r[1]}</div>`).join('')}<div class="row" style="margin-top:14px"><button class="btn alt" onclick="meetM(${id})">Book a meeting with the owner</button><button class="btn" onclick="bookM(${id})">Book this venue</button></div>`)}
function meetM(id){if(!need())return;const v=V.find(x=>x.id===id);modal(`<h2>Meet the owner of ${v.n}</h2><div class="f"><div><label>Visit date</label><input id="md" type="date" min="${today}" value="${q.date&&q.date>today?'':today}"></div><div><label>Time slot</label><select id="mt">${['11:00 AM','1:00 PM','3:00 PM','5:00 PM','7:00 PM'].map(t=>`<option>${t}</option>`).join('')}</select></div></div><p class="mut">You will see the hall, discuss the menu and confirm the price in person.</p><p id="er" style="color:var(--bad)"></p><button class="btn" onclick="addMeet(${id})">Confirm meeting</button>`)}
function addMeet(id){const v=V.find(x=>x.id===id),d=$('#md').value;if(!d)return $('#er').textContent='Choose a visit date.';bk.unshift({id:Date.now(),kind:'Venue meeting',vid:id,title:v.n,date:d,note:'Time: '+$('#mt').value,st:'Confirmed'});save();closeM();toast('Meeting booked');go('bookings')}
function bookM(id){if(!need())return;const v=V.find(x=>x.id===id);modal(`<h2>Book ${v.n}</h2><div class="f"><div><label>Event date</label><input id="bd" type="date" min="${today}" value="${q.date}" oninput="tot(${id})"></div><div><label>Guests (max ${v.cap})</label><input id="bg" type="number" min="20" max="${v.cap}" value="${Math.min(+q.guests||200,v.cap)}" oninput="tot(${id})"></div></div><div class="invite" style="margin:14px 0"><div id="bt"></div></div><p id="er" style="color:var(--bad)"></p><button class="btn" onclick="addBook(${id})">Pay advance and confirm</button>`);tot(id)}
function tot(id){const v=V.find(x=>x.id===id),g=+$('#bg').value||0,t=v.pp*g,d=$('#bd').value;$('#bt').innerHTML=`<div class="row"><span>Estimated total</span><b>${fmt(t)}</b></div><div class="row"><span>Advance (25%)</span><b>${fmt(t*.25)}</b></div><div class="row"><span>Availability</span><span class="tag ${!d||avail(v,d)?'ok':'no'}">${!d?'Choose a date':avail(v,d)?'Available':'Already booked'}</span></div>`}
function addBook(id){const v=V.find(x=>x.id===id),d=$('#bd').value,g=+$('#bg').value;if(!d)return $('#er').textContent='Choose your event date.';if(!avail(v,d))return $('#er').textContent='This date is taken. Pick another date.';if(!g||g>v.cap||g<20)return $('#er').textContent='Guests must be between 20 and '+v.cap+'.';
bk.unshift({id:Date.now(),kind:'Venue booking',vid:id,title:v.n,date:d,note:g+' guests, total '+fmt(v.pp*g)+', advance '+fmt(v.pp*g*.25),st:'Confirmed'});save();closeM();toast('Venue booked');go('bookings')}
const D=[['Biryani',350],['Chicken karahi',450],['Mutton qorma',650],['Seekh kabab',300],['BBQ platter',750],['Palak paneer',280],['Naan and roti',45],['Mixed salad',80],['Raita',60],['Kheer',120],['Gulab jamun',100],['Fruit chaat',110],['Soft drinks',90],['Kashmiri chai',70]];
let pick=['Biryani','Chicken karahi','Kheer'];
function catering(){return`<h2>Catering</h2><p class="mut">Choose dishes, add guests and budget. We estimate the cost and tell you if it fits.</p><div class="chips">${D.map(d=>`<button class="chip ${pick.includes(d[0])?'on':''}" onclick="tg('${d[0]}')">${d[0]} (${d[1]})</button>`).join('')}</div><div class="invite" style="max-width:560px"><div class="f"><div><label for="cg">Number of guests</label><input id="cg" type="number" min="10" value="300" oninput="cq()"></div><div><label for="cb">Catering budget (PKR)</label><input id="cb" type="number" step="10000" value="300000" oninput="cq()"></div></div><div id="cr" style="position:relative;z-index:1;margin-top:14px"></div></div>`+(setTimeout(cq),'')}
function tg(n){pick=pick.includes(n)?pick.filter(x=>x!==n):[...pick,n];go('catering')}
function cq(){const g=+$('#cg').value||0,b=+$('#cb').value||0,ph=pick.reduce((s,n)=>s+D.find(d=>d[0]===n)[1],0),t=ph*g*1.05,ok=t<=b;$('#cr').innerHTML=`<div class="row"><span>Cost per head</span><b>${fmt(ph)}</b></div><div class="row"><span>Total with 5% service</span><b>${fmt(t)}</b></div><p><span class="tag ${ok?'ok':'no'}">${!pick.length?'Select at least one dish':ok?'Within budget, '+fmt(b-t)+' to spare':'Over budget by '+fmt(t-b)}</span></p>${!ok&&pick.length&&g?`<p class="mut">To fit, serve up to ${Math.floor(b/(ph*1.05))} guests or remove a dish.</p>`:''}<button class="btn" onclick="addSv('Catering','Catering request','${g} guests, '+pick.join(', ')+', est. ${Math.round(t).toLocaleString('en-PK')} PKR')">Request quotes from caterers</button>`}
const S=[['Decoration','Gul Mehfil Decor','Lahore',150000,4.8],['Decoration','Shaadi Studio Designs','Karachi',180000,4.6],['Decoration','Floral Arc Events','Islamabad',200000,4.7],['DJ and sound','DJ Rafay Live','Karachi',60000,4.5],['DJ and sound','Beatwave Entertainment','Lahore',75000,4.6],['Photo and video','Frame and Feather Studio','Islamabad',120000,4.9],['Photo and video','Candid Nikah Films','Lahore',95000,4.5],['Bridal makeup','Zarmeen Beauty Studio','Karachi',45000,4.7],['Mehndi artist','Henna by Noor','Rawalpindi',15000,4.8],['Lighting','Roshni Light Works','Faisalabad',50000,4.3],['Transport','Royal Rides Limousine','Lahore',35000,4.4],['Wedding cards','Card Kothi Printers','Multan',20000,4.2]];
function services(){const cats=['All',...new Set(S.map(s=>s[0]))];return`<h2>Event services</h2><div class="chips">${cats.map(c=>`<button class="chip ${svc===c?'on':''}" onclick="svc='${c}';go('services')">${c}</button>`).join('')}</div><div class="grid">${S.filter(s=>svc==='All'||s[0]===svc).map(s=>`<div class="c"><div class="b"><span class="tag" style="align-self:flex-start">${s[0]}</span><h3 style="margin:4px 0 0">${s[1]}</h3><span class="mut">${s[2]}, ★ ${s[4]}</span><span>From ${fmt(s[3])}</span><button class="btn sm" onclick="addSv('${s[0]}','${s[1]}','Quote requested, from ${s[3].toLocaleString('en-PK')} PKR')">Request a quote</button></div></div>`).join('')}</div>`}
const FW=[['Cold spark fountains','5 min','Smoke-free sparks for grand entries and cake cutting. Safe indoors.',35000,'✨','Indoor safe'],['Bridal entry sparklers','3 min','A sparkler walkway for the bride and groom entry.',20000,'🎇','Indoor safe'],['Sky shots, 100 shells','8 min','Colourful shells over the venue lawn after dinner.',90000,'🎆','Outdoor only'],['Grand finale, 300 shells','15 min','A full show with music and a finale barrage.',220000,'🎆','Outdoor only']];
let fwc='Karachi';
function fireworks(){const cs=['Karachi','Lahore','Islamabad','Rawalpindi','Faisalabad','Multan','Peshawar','Quetta'];return`<h2>Fireworks</h2><p class="mut">Add a show to your night. Pick your city, choose a package and request a quote for your event date.</p><canvas id="fw" style="width:100%;height:220px;border-radius:16px;display:block" aria-label="Fireworks preview"></canvas><div class="chips">${cs.map(c=>`<button class="chip ${fwc===c?'on':''}" onclick="fwc='${c}';go('fireworks')">${c}</button>`).join('')}</div><p class="mut">${2+hash(fwc)%4} licensed operators available in ${fwc}.</p><div class="grid">${FW.map(f=>`<div class="c"><div class="art" style="height:100px;background:linear-gradient(135deg,#3A2A20,#7A5236)"><span>${f[4]}</span></div><div class="b"><h3 style="margin:0">${f[0]}</h3><div class="row"><span class="tag">${f[1]}</span><span class="tag ${f[5]==='Indoor safe'?'ok':'no'}">${f[5]}</span></div><span class="mut">${f[2]}</span><b>From ${fmt(f[3])}</b><button class="btn sm" onclick="addSv('Fireworks','${f[0]}','${fwc}, from ${f[3].toLocaleString('en-PK')} PKR')">Request a quote</button></div></div>`).join('')}</div><div class="invite" style="margin-top:20px"><h3>Safety first</h3><p class="mut" style="position:relative;z-index:1;margin:0">Confirm with your venue that fireworks are allowed. Operators keep a safe distance from guests and buildings, and outdoor shows need open sky. Ask the operator about local permission before the event day.</p></div>`+(setTimeout(fwAnim),'')}
function fwAnim(){const c=$('#fw');if(!c)return;const w=c.width=c.clientWidth,h=c.height=220,x=c.getContext('2d');x.fillStyle='#20160F';x.fillRect(0,0,w,h);if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;let P=[],t=0;const cols=['#F5D08A','#E8A87C','#F7E7C6','#C9A27E','#FFB4A2'];(function f(){if($('#fw')!==c)return;x.fillStyle='rgba(32,22,15,.22)';x.fillRect(0,0,w,h);if(t++%40===1){const bx=60+Math.random()*(w-120),by=40+Math.random()*80,col=cols[Math.random()*5|0];for(let i=0;i<46;i++){const a=i/46*6.283,s=1+Math.random()*2.6;P.push({x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:60,c:col})}}P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.vx*=.99;p.l--;x.globalAlpha=p.l/60;x.fillStyle=p.c;x.fillRect(p.x,p.y,2.6,2.6)});x.globalAlpha=1;requestAnimationFrame(f)})()}
function addSv(k,t,n){if(!need())return;bk.unshift({id:Date.now(),kind:k,title:t,date:q.date||'',note:n,st:'Requested'});save();toast('Request sent');go('bookings')}
function bookings(){if(!user)return`<div class="empty"><h3>Log in to see your bookings</h3><p>Your meetings, venue bookings and service requests appear here.</p><button class="btn" onclick="authM('login')">Log in</button></div>`;
const fv=V.filter(v=>favs.includes(v.id));
return`<h2>My bookings</h2>${bk.length?bk.map(b=>`<div class="c" style="margin-bottom:12px"><div class="b"><div class="row"><h3 style="margin:0">${b.title}</h3><span class="tag ${b.st==='Cancelled'?'no':'ok'}">${b.st}</span></div><span class="mut">${b.kind}${b.date?', '+b.date:''}</span><span>${b.note}</span>${b.st!=='Cancelled'?`<button class="btn alt sm" style="align-self:flex-start" onclick="cancel(${b.id})">Cancel</button>`:''}</div></div>`).join(''):'<div class="empty"><h3>Nothing booked yet</h3>Search venues to book your first meeting.</div>'}<h2 style="margin-top:28px">Saved venues</h2>${fv.length?`<div class="grid">${fv.map(v=>card(v,+q.guests)).join('')}</div>`:'<p class="mut">Tap the heart on a venue to save it here.</p>'}`}
function cancel(id){const b=bk.find(x=>x.id===id);if(b)b.st='Cancelled';save();toast('Booking cancelled');go('bookings')}
go('home');
</script></body></html>
